name: update-prices

on:
  schedule:
    - cron: "0 */3 * * *"   # 3시간마다 (UTC 기준)
  workflow_dispatch:          # 수동 실행 버튼도 활성화

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python fetch_prices.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "update prices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
